services:
  postgres:
    image: postgres:17-alpine
    container_name: crmpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - crmpro-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: crmpro-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - crmpro-network
    command: redis-server --appendonly yes

  adminer:
    image: adminer
    container_name: crmpro-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - postgres
    networks:
      - crmpro-network

  # Local SMTP catcher for password-reset / invite / notification emails.
  # API: MAIL_TRANSPORT=smtp SMTP_HOST=localhost SMTP_PORT=1025 — inbox UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: crmpro-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - crmpro-network

volumes:
  postgres-data:
  redis-data:

networks:
  crmpro-network:
    driver: bridge
